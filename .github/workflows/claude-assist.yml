name: Claude Assist

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assist:
    name: Claude assist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only trigger on /claude commands
    if: |
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       startsWith(github.event.comment.body, '/claude'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract request
        id: parse
        run: |
          # Strip the /claude prefix and trim whitespace
          COMMENT="${{ github.event.comment.body }}"
          REQUEST="${COMMENT#/claude}"
          REQUEST="${REQUEST#"${REQUEST%%[![:space:]]*}"}"  # ltrim
          echo "request=${REQUEST}" >> "$GITHUB_OUTPUT"

          # Determine context: issue or PR
          if [ -n "${{ github.event.issue.pull_request.url }}" ] || \
             [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "context=pr" >> "$GITHUB_OUTPUT"
            PR_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
            echo "number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          else
            echo "context=issue" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: React to comment (acknowledge)
        run: |
          # Add 👀 reaction to show Claude received the request
          COMMENT_ID="${{ github.event.comment.id }}"
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          gh api -X POST "repos/${OWNER}/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="eyes" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Glob,Grep"
          max_turns: "20"
          timeout_seconds: "900"
          prompt: |
            You are Claude Assist, responding to a request from @${{ github.event.comment.user.login }}
            in ${{ github.repository }}.

            **Context:** ${{ steps.parse.outputs.context }} #${{ steps.parse.outputs.number }}
            **Request:** ${{ steps.parse.outputs.request }}

            ## Instructions

            1. Read relevant context:
               ```bash
               cat CLAUDE.md 2>/dev/null || true
               cat AGENTS.md 2>/dev/null || true
               ```

            2. If this is a PR request, gather PR context:
               ```bash
               gh pr view ${{ steps.parse.outputs.number }} --json title,body,baseRefName,headRefName,files 2>/dev/null || true
               ```

            3. If this is an issue, gather issue context:
               ```bash
               gh issue view ${{ steps.parse.outputs.number }} --json title,body,comments 2>/dev/null || true
               ```

            4. Address the request. Read relevant files as needed.

            5. Post your response as a comment:
               ```bash
               OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
               REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)

               gh api -X POST "repos/${OWNER}/${REPO}/issues/${{ steps.parse.outputs.number }}/comments" \
                 -f body="<your response here>

               *🤖 Claude Assist · requested by @${{ github.event.comment.user.login }}*"
               ```

            Be concise and directly useful. If you need more information, say what specifically.
            Do not modify any files unless the user explicitly asks you to implement something.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
