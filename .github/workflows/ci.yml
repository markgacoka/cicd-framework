name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on new push to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to your runtime: node | python | go | rust | make | none
  RUNTIME: node
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  GO_VERSION: '1.22'

jobs:
  # ── GUARD ────────────────────────────────────────────────────────────────
  # Quick checks before expensive jobs — fail fast
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.detect.outputs.runtime }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect runtime
        id: detect
        run: |
          # Auto-detect if RUNTIME is not explicitly set
          if [ "$RUNTIME" = "node" ] || [ -f "package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ "$RUNTIME" = "python" ] || [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then
            echo "runtime=python" >> "$GITHUB_OUTPUT"
          elif [ "$RUNTIME" = "go" ] || [ -f "go.mod" ]; then
            echo "runtime=go" >> "$GITHUB_OUTPUT"
          elif [ "$RUNTIME" = "rust" ] || [ -f "Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "Makefile" ]; then
            echo "runtime=make" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=none" >> "$GITHUB_OUTPUT"
          fi

          # Check if a test script/directory exists
          if [ -d "tests" ] || [ -d "test" ] || [ -d "__tests__" ] || \
             ([ -f "package.json" ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null); then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for secrets in code
        run: |
          # Lightweight secret pattern scan — catches common mistakes
          if grep -rE \
            '(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{32,}|ghp_[a-zA-Z0-9]{36}|xoxb-[0-9]+-[a-zA-Z0-9]+)' \
            --include="*.{js,ts,py,go,rs,sh,yml,yaml,json,env}" \
            --exclude-dir=".git" . 2>/dev/null; then
            echo "::error::Potential secret detected in source code. Remove it before merging."
            exit 1
          fi
          echo "No secrets detected."

  # ── LINT ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node.js
      - name: Setup Node
        if: needs.guard.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (Node)
        if: needs.guard.outputs.runtime == 'node'
        run: npm ci --prefer-offline

      - name: Lint (Node — ESLint)
        if: needs.guard.outputs.runtime == 'node'
        run: |
          if [ -f ".eslintrc*" ] || [ -f "eslint.config*" ]; then
            npx eslint . --max-warnings 0
          else
            echo "No ESLint config found — skipping."
          fi

      - name: Format check (Node — Prettier)
        if: needs.guard.outputs.runtime == 'node'
        run: |
          if [ -f ".prettierrc*" ] || [ -f "prettier.config*" ]; then
            npx prettier --check .
          else
            echo "No Prettier config found — skipping."
          fi

      # Python
      - name: Setup Python
        if: needs.guard.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff (Python)
        if: needs.guard.outputs.runtime == 'python'
        run: pip install ruff

      - name: Lint (Python — ruff)
        if: needs.guard.outputs.runtime == 'python'
        run: ruff check .

      # Go
      - name: Setup Go
        if: needs.guard.outputs.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint (Go — golangci-lint)
        if: needs.guard.outputs.runtime == 'go'
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

      # Rust
      - name: Setup Rust
        if: needs.guard.outputs.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Lint (Rust — clippy + fmt)
        if: needs.guard.outputs.runtime == 'rust'
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      # Workflow YAML lint — always run
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.4

  # ── TYPECHECK ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.guard.outputs.runtime == 'node' || needs.guard.outputs.runtime == 'python'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: needs.guard.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (Node)
        if: needs.guard.outputs.runtime == 'node'
        run: npm ci --prefer-offline

      - name: Typecheck (TypeScript)
        if: needs.guard.outputs.runtime == 'node'
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found — skipping."
          fi

      - name: Setup Python
        if: needs.guard.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Typecheck (Python — mypy)
        if: needs.guard.outputs.runtime == 'python'
        run: |
          pip install mypy
          if [ -f "mypy.ini" ] || [ -f "setup.cfg" ] || grep -q "\[mypy\]" pyproject.toml 2>/dev/null; then
            mypy .
          else
            echo "No mypy config found — skipping."
          fi

  # ── TEST ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: [guard, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.guard.outputs.has_tests == 'true'
    steps:
      - uses: actions/checkout@v4

      # Node
      - name: Setup Node
        if: needs.guard.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install (Node)
        if: needs.guard.outputs.runtime == 'node'
        run: npm ci --prefer-offline

      - name: Test (Node)
        if: needs.guard.outputs.runtime == 'node'
        run: npm test -- --ci --coverage 2>/dev/null || npm test
        env:
          CI: true
          NODE_ENV: test

      # Python
      - name: Setup Python
        if: needs.guard.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (Python)
        if: needs.guard.outputs.runtime == 'python'
        run: |
          pip install -e ".[dev,test]" 2>/dev/null || \
          pip install -r requirements-dev.txt 2>/dev/null || \
          pip install -r requirements.txt 2>/dev/null || true

      - name: Test (Python — pytest)
        if: needs.guard.outputs.runtime == 'python'
        run: pytest --tb=short -q

      # Go
      - name: Setup Go
        if: needs.guard.outputs.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test (Go)
        if: needs.guard.outputs.runtime == 'go'
        run: go test ./... -race -timeout 120s

      # Rust
      - name: Setup Rust
        if: needs.guard.outputs.runtime == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Test (Rust)
        if: needs.guard.outputs.runtime == 'rust'
        run: cargo test --all

      # Make
      - name: Test (Make)
        if: needs.guard.outputs.runtime == 'make'
        run: make test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
            junit.xml
            pytest-results.xml
          retention-days: 7
          if-no-files-found: ignore

  # ── DEPENDENCY AUDIT ─────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on PRs to main or develop (not every push)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: needs.guard.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit (npm)
        if: needs.guard.outputs.runtime == 'node'
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't block (lockfile audit only)

      - name: Setup Python
        if: needs.guard.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit (Python — pip-audit)
        if: needs.guard.outputs.runtime == 'python'
        run: |
          pip install pip-audit
          pip-audit --progress-spinner=off
        continue-on-error: true
